modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "Prevents natural and world-generation Hybrid Aquatic Otter spawns. Configurable; other mobs, existing Otters, breeding, spawn eggs, and commands are preserved."

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "hybrid_aquatic"
type = "required"
versionRange = "[1.7.4,)"
ordering = "AFTER"
side = "BOTH"
